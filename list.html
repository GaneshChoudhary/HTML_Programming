<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
</head>
<body>
    <ul>
        <h3>UnOrdered List</h3>
        <li>Fruits</li>
        <ul type="circle">
            <li>Mango</li>
            <li>Apple</li>
            <li>Orange</li>
        </ul>
        <li>Vegetables</li>
        <ul type="square">
            <li>Tomato</li>
            <li>Onion</li>
            <li>Potato</li>
        </ul>
    </ul>

    <ol>
        <h3>Ordered List</h3>
        <li>Fruits</li>
        <ol type="a">
            <li>Mango</li>
            <li>Apple</li>
            <li>Orange</li>
        </ol>
        <li>Vegetables</li>
        <ol type="i">
            <li>Tomato</li>
            <li>Onion</li>
            <li>Potato</li>
        </ol>
    </ol>
    
</body>
</html>
