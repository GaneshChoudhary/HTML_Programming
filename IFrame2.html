<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFrame Example 2</title>
</head>
<body>
    <iframe name="Target" frameborder="2"></iframe>
    <div>
    <a href="video/video.mp4" target="Target">Video</a>
    <a href="video/audio.mp3" target="Target">Audio</a>
    <a href="video/image.jpg" target="Target">Image</a>
    </div>
    
</body>
</html>
