<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
</head>
<body>
    <form>
        <h2>Registration Form</h2>
        <hr>
        <label>Full Name: </label>
        <input type="text" placeholder="Enter Your Full Name">
        <br><br>
        <label>Email: </label>
        <input type="email" placeholder="Enter Your Password">
        <br><br>
        <label>Password:</label>
        <input type="password" placeholder="Enter Your Password">
        <br><br>
        <label>Mobile No: </label>
        <input type="number" placeholder="Enter Your Mobile No.">
        <br><br>
        <label style="font-weight: bold;">Select Gender: </label>
        <input type="radio" name="Gender">
        <label>Male</label>
        <input type="radio" name="Gender">
        <label>Female</label>
        <input type="radio" name="Gender">
        <label>Others</label>
        <br><br>
        <label style="font-weight: bold;">Technologies: </label>
        <br>
        <input type="checkbox">
        <label>Java</label>
        <br>
        <input type="checkbox">
        <label>Python</label>
        <br>
        <input type="checkbox">
        <label>Data Science</label>
        <br>
        <input type="checkbox">
        <label>Data Analysis</label>
        <br><br>
        <label style="font-weight: bold;">Select Color: </label>
        <input type="color" value="red">
        <br><br>
        <label style="font-weight: bold;">Coding Experience: </label>
        <select>
        <option value="Fresher">Fresher</option>
        <option value="Intermidiate">Intermidiate</option>
        <option value="Experienced">Experienced</option>
        </select>
        <br><br>
        <label style="font-weight: bold;">Choose File to Upload : </label>
        <input type="file">
        <br><br>
        <label style="font-weight: bold;">Message :</label>
        <br><br>
        <textarea placeholder="Enter Your Message"></textarea>
        <br><br><br>
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
        <br><br>
        <hr>
    </form>
</body>
</html>
