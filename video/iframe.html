<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFrame</title>
</head>
<body>
    <iframe name="Action" frameborder="2" width="500px" height="500px"></iframe>
    <div>
        <a href="video.mp4" target="Action">Video</a>
        <a href="image.jpg" target="Action">Image</a>
        <a href="audio.mp3" target="Action">Audio</a>
    </div>
</body>
</html>
