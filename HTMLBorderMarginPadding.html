<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Border Margin Padding</title>
    <style>
        body{
            width: 400px;
            height: 400px;
            margin-top: 30px;
            margin-left: 450px;
            background-color: whitesmoke;
            
        }
        #bor1{
            border: 10px;
            border-style: solid;
            border-color: blue;
            text-align: center;
            margin: 10px 20px 10px 20px;
            padding: 30px;
            border-radius: 30px;
            background-color: lightblue;
        }
        #bor2{
            border: 10px;
            border-style: dashed;
            border-color: green;
            text-align: center;
            margin: 10px 20px 10px 20px;
            padding: 30px;
            border-radius: 30px;
            background-color: lightgreen;
        }
        #bor3{
            border: 10px;
            border-style: double;
            border-color: yellow;
            text-align: center;
            margin: 10px 20px 10px 20px;
            padding: 30px;
            border-radius: 30px;
            background-color: lightyellow;
        }
        #bor4{
            border: 10px;
            border-style: groove;
            border-color: orange;
            text-align: center;
            margin: 10px 20px 10px 20px;
            padding: 30px;
            border-radius: 30px;
            background-color: lightsalmon;
        }
        #bor5{
            border: 10px;
            border-style: ridge;
            border-color: red;
            text-align: center;
            margin: 10px 20px 10px 20px;
            padding: 30px;
            border-radius: 30px;
            background-color: lightcoral;
        }
    </style>
</head>
<body>
    <div>
        <h3 id="bor1">Welcome To TechnoBrilliant Learning and Solutions</h3>
    </div>
    <div>
        <h3 id="bor2">Welcome To TechnoBrilliant Learning and Solutions</h3>
    </div>
    <div>
        <h3 id="bor3">Welcome To TechnoBrilliant Learning and Solutions</h3>
    </div>
    <div>
        <h3 id="bor4">Welcome To TechnoBrilliant Learning and Solutions</h3>
    </div>
    <div>
        <h3 id="bor5">Welcome To TechnoBrilliant Learning and Solutions</h3>
    </div>
    
</body>
</html>
