<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <style>
        * {
            margin: 5px 0px;
        }

        body {
            background-image: url(BookStoreBG.img);
            background-size: cover;
        }

        h1 {
            border: 5px;
            border-color: black;
            background-color: darkgoldenrod;
            color: white;
            border-radius: 10px;
            text-align: center;
            padding: 10px;
        }

        nav {
            background-color: black;
            padding: 10px;
            border-radius: 10px;
        }

        a {
            color: white;
        }

        footer {
            margin-top: 60px;
            padding: 10px;
            text-align: center;
            background-color: black;
            border-radius: 10px;
            color: white;
        }

        .card {
            display: inline;
        }

        .details {
            margin-top: 30px;
            color: white;
            background-color: black;
        }

        iframe {
            margin-left: 350px;
            border-radius: 10px;
            margin-top: 30px;
        }

        .form {
            background-color: black;
            color: white;
            text-align: center;
        }
        .form div{
            display: block;
        }
    </style>
</head>

<body>
    <h1>Book Store</h1>
    <nav>
        <a href="1home.html" style="padding: 10px 130px;">Home</a>
        <a href="2about.html" style="padding: 10px 130px;">About Us</a>
        <a href="3books.html" style="padding: 10px 130px;">Books</a>
        <a href="4contact.html" style="padding: 10px 130px;">Contact</a>
    </nav>

    <div class="card">
        <div class="details">
            <p style="text-align: center; font-size:x-large;"><strong>Our Details:</strong></p>
            <p style="text-align: center;"><strong>Contact :</strong> 1234567890</p>
            <p style="text-align: center;"><strong>Email :</strong> bookstore@gmail.com</p>
            <p style="text-align: center;"><strong>Address :</strong> abc building, xyz street, dhankawadi, pune,
                maharashtra, pincode - 123456</p>
        </div>

        <div class="map">
            <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d248815.85822883708!2d77.62197175!3d12.987977!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3bae1670c9b44e6d%3A0xf8dfc3e8517e4fe0!2sBengaluru%2C%20Karnataka!5e0!3m2!1sen!2sin!4v1791809751929!5m2!1sen!2sin"
                width="500" height="300"></iframe>
        </div>
    </div>

    <div class="form">
        <h2 style="margin: 10px; padding: 30px;">Have something to say?...Contact Us</h2>
        <div style="display: inline-block;">
            <label>Your Name : </label>
            <input type="text" placeholder="Enter your name" style="margin-left: 145px;">
        </div>
        <div>
            <label>Email : </label>
            <input type="email" placeholder="Enter your email" style="margin-left: 180px;">
        </div>
        <div>
            <label>Query, Message, Feedback : </label>
            <input type="text" placeholder="Enter here" style="margin-left: 50px;">
        </div>
        <div>
            <button>Submit</button>
        </div>
    </div>






    <footer>
        © Copyright - Book Store
    </footer>

</html>
